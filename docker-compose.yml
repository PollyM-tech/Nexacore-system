name: lintech

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-isp} -d ${POSTGRES_DB:-isp}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: lintech-backend:${LINTECH_RELEASE:-dev}
    build:
      context: ./backend
      args:
        LINTECH_RELEASE: ${LINTECH_RELEASE:-development}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      LINTECH_FIELD_ENCRYPTION_KEY: ${LINTECH_FIELD_ENCRYPTION_KEY:?set LINTECH_FIELD_ENCRYPTION_KEY in .env}
      LINTECH_RELEASE: ${LINTECH_RELEASE:-development}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Africa/Nairobi}
      LINTECH_ENV: ${LINTECH_ENV:-development}
      LINTECH_RADIUS_ISOLATED: ${LINTECH_RADIUS_ISOLATED:-0}
      LINTECH_RADIUS_INTERNAL_TOKEN: ${LINTECH_RADIUS_INTERNAL_TOKEN:-}
      RADIUS_CLIENT_NETWORK: ${RADIUS_CLIENT_NETWORK:-192.168.88.0/24}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-isp}:${POSTGRES_PASSWORD:-isp_password}@db:5432/${POSTGRES_DB:-isp}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-30}
      JWT_REFRESH_LIFETIME_DAYS: ${JWT_REFRESH_LIFETIME_DAYS:-7}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8000/api/health/"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  qcluster:
    image: lintech-backend:${LINTECH_RELEASE:-dev}
    build:
      context: ./backend
      args:
        LINTECH_RELEASE: ${LINTECH_RELEASE:-development}
    restart: unless-stopped
    command: ["qcluster"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *backend_env

  freeradius:
    image: lintech-freeradius:${LINTECH_RELEASE:-dev}
    build:
      context: ./freeradius
      args:
        LINTECH_RELEASE: ${LINTECH_RELEASE:-development}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_password}
      RADIUS_CLIENT_NETWORK: ${RADIUS_CLIENT_NETWORK:-192.168.88.0/24}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:?set RADIUS_SHARED_SECRET in .env}
      LINTECH_RADIUS_ISOLATED: ${LINTECH_RADIUS_ISOLATED:-0}
      LINTECH_RADIUS_INTERNAL_TOKEN: ${LINTECH_RADIUS_INTERNAL_TOKEN:-}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

  frontend:
    image: lintech-frontend:${LINTECH_RELEASE:-dev}
    build:
      context: ./frontend
      args:
        LINTECH_RELEASE: ${LINTECH_RELEASE:-development}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"

volumes:
  postgres_data: